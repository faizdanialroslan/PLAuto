name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      # not reusing npm test here - it opens browser tabs and points at a JRE path
      # that only exists on one local Mac, neither of which applies on this runner
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Allure HTML report
        if: always()
        run: npx allure generate reports/allure-results --clean -o reports/allure-report
      - name: Build Excel test case sheet
        if: always()
        run: node scripts/generate-xlsx-report.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: reports/playwright-html/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: reports/allure-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-case-excel
          path: test-cases/CIMB_Loan_Calculator_Test_Cases.xlsx
          retention-days: 14
